spring:
  application:
    name: ingestion-service

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASS:${REDIS_PASSWORD:}}

  docker:
    compose:
      file: ../docker-compose.yml
      start:
        arguments:
          - --scale
          - ingestion-service=0
      lifecycle-management: start-only

bvg:
  api:
    scheme: "http" # optional, http is default
    host: ${BVG_API_HOST:localhost}
    port: ${BVG_API_PORT:3000}

logging:
  level:
    root: "info"
    org.springframework.web: "debug"
    org.hibernate: "error"