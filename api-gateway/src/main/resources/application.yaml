server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: station-service-http
              uri: http://ingestion-service:8080
              predicates:
                - Path=/api/stations/**
            - id: commute-service-http
              uri: http://commute-service:8080
              predicates:
                - Path=/api/routes/**, /api/users/**
            - id: notification-service-ws
              uri: ws://notification-service:5000
              predicates:
                - Path=/ws/**
