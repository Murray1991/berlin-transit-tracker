server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: commute-service-http
          uri: http://localhost:8082
          predicates:
            - Path=/api/routes/**, /api/users/**
        - id: notification-service-ws
          uri: ws://localhost:5000
          predicates:
            - Path=/ws/**
