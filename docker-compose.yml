services:
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend-app
    container_name: frontend
    ports:
      - "5173:5173"

  ingestion-service:
    build:
      context: ./ingestion-service
    container_name: ingestion-service
    environment:
      BVG_API_HOST: bvg-api
      BVG_API_PORT: 3000
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASS: ${REDIS_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      - redis
      - bvg-api

  commute-service:
    build:
      context: ./commute-service
    container_name: commute-service
    environment:
      STATION_CATALOG_BASE_URL: http://ingestion-service:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USER: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASS: ${RABBITMQ_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASS: ${REDIS_PASSWORD}
    ports:
      - "8082:8080"
    depends_on:
      - db
      - redis
      - rabbitmq
      - ingestion-service

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5000:5000"
    depends_on:
      - rabbitmq
      - commute-service

  bvg-api:
    image: derhuerst/bvg-rest:6
    container_name: bvg-api
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    ports:
      - "3000:3000"

  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq
      - rabbitmq-log:/var/log/rabbitmq

  redis:
    image: redis:8.10.2
    labels:
      org.springframework.boot.ignore: "true"
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
    driver: local
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local
  postgres_data:
