services:
  ingestion-service:
    build:
      context: ./ingestion-service
    container_name: ingestion-service
    environment:
      BVG_API_HOST: bvg-api
      BVG_API_PORT: 3000
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASS: ${REDIS_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - bvg-api

  commute-service:
    build:
        context: ./commute-service
    container_name: commute-service  
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USER: ${RABBITMQ_USER}
      SPRINT_RABBITMQ_PASS: ${RABBITMQ_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASS: ${REDIS_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - redis
      - rabbitmq
      - ingestion-service
  
  bvg-api:
    image: derhuerst/bvg-rest:6
    container_name: bvg-api
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    ports:
      - "3000:3000"

  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq
      - rabbitmq-log:/var/log/rabbitmq

  redis:
    image: redis:8.10.2
    labels:
      org.springframework.boot.ignore: "true"
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
    driver: local
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local
  postgres_data:
